name: Update GitHub stats card

on:
  schedule:
    - cron: "15 0 * * *"   # daily at 00:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats.svg
        working-directory: github-stats
        env:
          GITHUB_USER: Zidhann7
          # Personal access token stored as a repo secret (never written to the SVG).
          # Falls back to the built-in token if GH_TOKEN is not set.
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: python generate_stats.py

      - name: Commit only if stats.svg changed
        run: |
          if git diff --quiet -- github-stats/stats.svg; then
            echo "stats.svg unchanged - nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add github-stats/stats.svg
            git commit -m "chore: update GitHub stats card"
            git push
          fi
