<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Mohammad Zidan, Data Analyst, animated header" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Mohammad Zidan — Data Analyst</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0A22"/>
      <stop offset="55%" stop-color="#241854"/>
      <stop offset="100%" stop-color="#3D2172"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9F75FF"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="barGradHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4D9FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- faint dashboard grid -->
  <line x1="40" y1="250" x2="860" y2="250" stroke="#FFFFFF" stroke-opacity="0.05"/>
  <line x1="40" y1="220" x2="860" y2="220" stroke="#FFFFFF" stroke-opacity="0.05"/>
  <line x1="40" y1="190" x2="860" y2="190" stroke="#FFFFFF" stroke-opacity="0.05"/>
  <line x1="40" y1="280" x2="860" y2="280" stroke="#FFFFFF" stroke-opacity="0.22"/>

  <!-- live badge -->
  <circle cx="732" cy="34" r="5" fill="#4ADE80">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="746" y="39" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#C9BFFF">Live analytics</text>

  <!-- title block: fades + rises in once on load -->
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.05;1" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,14;0,0" keyTimes="0;1" dur="0.8s" fill="freeze"/>

    <text x="40" y="92" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#F5F3FF">Mohammad Zidan</text>
    <text x="40" y="122" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#C9BFFF">Turning raw data into decisions stakeholders act on.</text>

    <!-- tool pills -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#E9E4FF">
      <rect x="40" y="142" width="76" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="54" y="161">Python</text>

      <rect x="126" y="142" width="56" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="140" y="161">SQL</text>

      <rect x="192" y="142" width="96" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="206" y="161">Power BI</text>

      <rect x="298" y="142" width="88" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="312" y="161">Tableau</text>

      <rect x="396" y="142" width="70" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="410" y="161">GenAI</text>
    </g>
  </g>

  <!-- animated column chart -->
  <g>
    <!-- bar 0 -->
    <rect x="40" y="280" width="60" height="0" rx="6" fill="url(#barGrad)">
      <animate attributeName="height" values="0;30" dur="0.9s" begin="0.50s" fill="freeze"/>
      <animate attributeName="y" values="280;250" dur="0.9s" begin="0.50s" fill="freeze"/>
      <animate attributeName="height" values="30;26;30" keyTimes="0;0.5;1" dur="3.2s" begin="1.70s" repeatCount="indefinite"/>
      <animate attributeName="y" values="250;254;250" keyTimes="0;0.5;1" dur="3.2s" begin="1.70s" repeatCount="indefinite"/>
    </rect>
    <!-- bar 1 -->
    <rect x="135" y="280" width="60" height="0" rx="6" fill="url(#barGrad)">
      <animate attributeName="height" values="0;42" dur="0.9s" begin="0.62s" fill="freeze"/>
      <animate attributeName="y" values="280;238" dur="0.9s" begin="0.62s" fill="freeze"/>
      <animate attributeName="height" values="42;38;42" keyTimes="0;0.5;1" dur="3.2s" begin="1.82s" repeatCount="indefinite"/>
      <animate attributeName="y" values="238;242;238" keyTimes="0;0.5;1" dur="3.2s" begin="1.82s" repeatCount="indefinite"/>
    </rect>
    <!-- bar 2 -->
    <rect x="230" y="280" width="60" height="0" rx="6" fill="url(#barGrad)">
      <animate attributeName="height" values="0;36" dur="0.9s" begin="0.74s" fill="freeze"/>
      <animate attributeName="y" values="280;244" dur="0.9s" begin="0.74s" fill="freeze"/>
      <animate attributeName="height" values="36;32;36" keyTimes="0;0.5;1" dur="3.2s" begin="1.94s" repeatCount="indefinite"/>
      <animate attributeName="y" values="244;248;244" keyTimes="0;0.5;1" dur="3.2s" begin="1.94s" repeatCount="indefinite"/>
    </rect>
    <!-- bar 3 -->
    <rect x="325" y="280" width="60" height="0" rx="6" fill="url(#barGrad)">
      <animate attributeName="height" values="0;52" dur="0.9s" begin="0.86s" fill="freeze"/>
      <animate attributeName="y" values="280;228" dur="0.9s" begin="0.86s" fill="freeze"/>
      <animate attributeName="height" values="52;48;52" keyTimes="0;0.5;1" dur="3.2s" begin="2.06s" repeatCount="indefinite"/>
      <animate attributeName="y" values="228;232;228" keyTimes="0;0.5;1" dur="3.2s" begin="2.06s" repeatCount="indefinite"/>
    </rect>
    <!-- bar 4 -->
    <rect x="420" y="280" width="60" height="0" rx="6" fill="url(#barGrad)">
      <animate attributeName="height" values="0;46" dur="0.9s" begin="0.98s" fill="freeze"/>
      <animate attributeName="y" values="280;234" dur="0.9s" begin="0.98s" fill="freeze"/>
      <animate attributeName="height" values="46;42;46" keyTimes="0;0.5;1" dur="3.2s" begin="2.18s" repeatCount="indefinite"/>
      <animate attributeName="y" values="234;238;234" keyTimes="0;0.5;1" dur="3.2s" begin="2.18s" repeatCount="indefinite"/>
    </rect>
    <!-- bar 5 -->
    <rect x="515" y="280" width="60" height="0" rx="6" fill="url(#barGrad)">
      <animate attributeName="height" values="0;62" dur="0.9s" begin="1.10s" fill="freeze"/>
      <animate attributeName="y" values="280;218" dur="0.9s" begin="1.10s" fill="freeze"/>
      <animate attributeName="height" values="62;58;62" keyTimes="0;0.5;1" dur="3.2s" begin="2.30s" repeatCount="indefinite"/>
      <animate attributeName="y" values="218;222;218" keyTimes="0;0.5;1" dur="3.2s" begin="2.30s" repeatCount="indefinite"/>
    </rect>
    <!-- bar 6 -->
    <rect x="610" y="280" width="60" height="0" rx="6" fill="url(#barGrad)">
      <animate attributeName="height" values="0;56" dur="0.9s" begin="1.22s" fill="freeze"/>
      <animate attributeName="y" values="280;224" dur="0.9s" begin="1.22s" fill="freeze"/>
      <animate attributeName="height" values="56;52;56" keyTimes="0;0.5;1" dur="3.2s" begin="2.42s" repeatCount="indefinite"/>
      <animate attributeName="y" values="224;228;224" keyTimes="0;0.5;1" dur="3.2s" begin="2.42s" repeatCount="indefinite"/>
    </rect>
    <!-- bar 7 -->
    <rect x="705" y="280" width="60" height="0" rx="6" fill="url(#barGrad)">
      <animate attributeName="height" values="0;74" dur="0.9s" begin="1.34s" fill="freeze"/>
      <animate attributeName="y" values="280;206" dur="0.9s" begin="1.34s" fill="freeze"/>
      <animate attributeName="height" values="74;70;74" keyTimes="0;0.5;1" dur="3.2s" begin="2.54s" repeatCount="indefinite"/>
      <animate attributeName="y" values="206;210;206" keyTimes="0;0.5;1" dur="3.2s" begin="2.54s" repeatCount="indefinite"/>
    </rect>
    <!-- bar 8 (highlight, tallest) -->
    <rect x="800" y="280" width="60" height="0" rx="6" fill="url(#barGradHi)">
      <animate attributeName="height" values="0;88" dur="0.9s" begin="1.46s" fill="freeze"/>
      <animate attributeName="y" values="280;192" dur="0.9s" begin="1.46s" fill="freeze"/>
      <animate attributeName="height" values="88;84;88" keyTimes="0;0.5;1" dur="3.2s" begin="2.66s" repeatCount="indefinite"/>
      <animate attributeName="y" values="192;196;192" keyTimes="0;0.5;1" dur="3.2s" begin="2.66s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- trend line drawn over the bar tops once bars have grown -->
  <polyline points="70,250 165,238 260,244 355,228 450,234 545,218 640,224 735,206 830,192"
            fill="none" stroke="#F2C811" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0" dur="1.1s" begin="2.66s" fill="freeze"/>
  </polyline>

  <circle cx="70" cy="250" r="4.5" fill="#F2C811" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.25s" begin="2.66s" fill="freeze"/></circle>
  <circle cx="165" cy="238" r="4.5" fill="#F2C811" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.25s" begin="2.80s" fill="freeze"/></circle>
  <circle cx="260" cy="244" r="4.5" fill="#F2C811" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.25s" begin="2.94s" fill="freeze"/></circle>
  <circle cx="355" cy="228" r="4.5" fill="#F2C811" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.25s" begin="3.08s" fill="freeze"/></circle>
  <circle cx="450" cy="234" r="4.5" fill="#F2C811" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.25s" begin="3.22s" fill="freeze"/></circle>
  <circle cx="545" cy="218" r="4.5" fill="#F2C811" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.25s" begin="3.35s" fill="freeze"/></circle>
  <circle cx="640" cy="224" r="4.5" fill="#F2C811" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.25s" begin="3.49s" fill="freeze"/></circle>
  <circle cx="735" cy="206" r="4.5" fill="#F2C811" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.25s" begin="3.63s" fill="freeze"/></circle>
  <circle cx="830" cy="192" r="5.5" fill="#FDE68A" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.25s" begin="3.76s" fill="freeze"/></circle>

</svg>
